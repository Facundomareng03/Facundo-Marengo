ay:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin:20px 0}.tile,.card{background:linear-gradient(145deg,#ffffff,#f8faff);border:1px solid var(--line);border-radius:20px;padding:21px;box-shadow:0 8px 28px rgba(22,48,88,.06)}.tile{min-height:190px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.2s}.tile:hover{transform:translateY(-4px);border-color:var(--blue)}.symbol{font-size:2rem}.tile h3{margin:8px 0}.head{margin:35px 0 12px}.head h2{margin:0}.unit{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;padding:16px;margin:9px 0;border:1px solid var(--line);border-radius:14px;background:var(--p);color:var(--txt)}.unit:hover{border-color:var(--blue)}.unit small{display:block;color:var(--muted)}.progress-wrap{height:10px;background:#293a53;border-radius:30px;overflow:hidden;margin:12px 0}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .35s}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:13px;background:#000}.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.qbox{padding:17px;margin:13px 0;border:1px solid var(--line);border-radius:15px;background:#111c2d}.opt{display:block;text-align:left;width:100%;padding:12px;margin:8px 0;border-radius:11px;border:1px solid #354964;background:#192941;color:white}.opt.selected{border-color:var(--blue);background:#234064}.opt.correct{border-color:var(--good)}.opt.wrong{border-color:var(--bad)}.result{margin-top:16px;padding:18px;border:1px solid #37665b;background:#142d2b;border-radius:15px}.book-price{color:var(--gold);font-weight:800}.cert{background:#f8f4e9;color:#1b2638;border:10px double #b99a54;padding:30px;text-align:center;border-radius:7px}.cert h2{font:2rem Georgia,serif;color:#8a6c2e}.cert input{background:white;color:#172033;border:1px solid #b99a54;padding:10px;text-align:center;width:min(100%,350p /* Galería circular de materias y perfil */
.subject-showcase{margin:24px 0 34px;padding:22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#14243a,#101a2a);text-align:center}
.showcase-circle{width:clamp(150px,28vw,220px);height:clamp(150px,28vw,220px);margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;border:5px solid #ffffff20;box-shadow:0 12px 38px #0006,inset 0 0 35px #ffffff14;background:radial-gradient(circle at 30% 25%,#385d83,#15243b 68%);font-size:clamp(4rem,12vw,6.5rem);transition:opacity .35s,transform .5s}
.showcase-circle.changing{opacity:.15;transform:scale(.82)}.showcase-title{font-size:1.15rem;font-weight:800}.showcase-dots{display:flex;justify-content:center;gap:11px;margin-top:16px}.showcase-dots button{width:13px;height:13px;padding:0;border-radius:50%;border:1px solid #91a9c9;background:#52637c}.showcase-dots button.active{background:var(--cyan);border-color:var(--cyan);transform:scale(1.2)}
.tile-cover{height:112px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:3.7rem;margin:-3px -3px 13px;background:linear-gradient(135deg,#24466b,#18283e);border:1px solid #ffffff12}
.profile-layout{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:24px;align-items:start;margin-top:20px}.profile-photo{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 28%;border-radius:22px;border:1px solid var(--line);box-shadow:0 15px 38px #0005}.unit-progress{min-width:105px;text-align:right}.unit-progress .progress-wrap{margin:7px 0 3px;height:7px}.unit-progress small{color:var(--muted);font-size:.75rem}
@media(max-width:650px){.profile-layout{grid-template-columns:1fr}.profile-photo{max-width:300px;margin:auto}.unit{align-items:flex-start}.unit-progress{min-width:88px}}

.hero{padding-bottom:24px}.hero-slideshow{position:relative;height:clamp(220px,42vw,390px);margin-top:26px;border:1px solid #ffffff35;border-radius:22px;overflow:hidden;background:#07101d;box-shadow:0 18px 45px #0005}.hero-slide-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;transition:opacity .55s ease,transform 5s ease;transform:scale(1.035)}.hero-slide-image.fade{opacity:.12;transform:scale(1.09)}.hero-slide-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,8,16,.03) 25%,rgba(3,8,16,.88) 100%)}.hero-slide-caption{position:absolute;left:22px;right:22px;bottom:24px;text-align:left}.hero-slide-caption strong{font-size:clamp(1.45rem,4vw,2.3rem);display:block}.hero-slide-caption span{color:#e1e9f4}.hero-dots{display:flex;justify-content:center;gap:12px;position:absolute;bottom:13px;right:20px;z-index:2}.hero-dots button{width:12px;height:12px;padding:0;border-radius:50%;border:1px solid #fff;background:#ffffff70;box-shadow:0 1px 6px #0008}.hero-dots button.active{background:#fff;transform:scale(1.25)}.tile-cover{height:175px;position:relative;overflow:hidden;border-radius:14px;margin:-3px -3px 13px;background:#101a29}.tile-cover img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}.tile-cover:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(3,8,16,.22))}

.tile-cover{border-radius:16px;overflow:hidden}.tile:hover{box-shadow:0 14px 34px rgba(22,48,88,.12)}
.unit{background:#fff;color:var(--txt);border:1px solid var(--line);box-shadow:0 5px 18px rgba(22,48,88,.045)}

.video{background:#101827;border:1px solid var(--line);border-radius:18px}.book-mark{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:#1769e0;font-weight:800;margin-bottom:14px}

/* Alineación uniforme de bibliografía y acceso de estudiantes */
.books-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:stretch;margin:22px 0}
.book-card{height:100%;min-height:290px;display:flex;flex-direction:column;align-items:stretch;text-align:left}
.book-card .book-mark{min-height:22px}
.book-card h3{min-height:3.2em;margin:8px 0;display:flex;align-items:flex-start}
.book-card .book-description{min-height:3em;margin:0 0 12px}
.book-card .book-price{margin-top:auto;padding-top:12px}
.book-card .btn{width:100%;margin-top:10px}
.account-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:22px 0}
.account-card{height:100%}.account-card form{display:flex;flex-direction:column;gap:9px}.account-card label{font-weight:650;font-size:.92rem}.account-card input{width:100%;padding:12px 13px;border:1px solid var(--line);background:#f8faff;color:var(--txt);font:inherit;border-radius:11px}.account-card .btn{margin-top:8px}

@media(max-width:560px){.books-grid,.account-grid{grid-template-columns:1fr}.book-card{min-height:0}.book-card h3,.book-card .book-description{min-height:0}}

/* Ajuste final solicitado: alineación uniforme y estados azules de interacción */
.books-grid{align-items:stretch;grid-auto-rows:1fr}
.book-card{display:grid;grid-template-rows:22px 3.2em 3em 1fr 44px;align-content:stretch;min-height:300px;height:100%}
.book-card .book-mark,.book-card h3,.book-card .book-description,.book-card .book-price,.book-card .btn{margin-top:0;margin-bottom:0;min-height:0;align-self:stretch}
.book-card h3{display:flex;align-items:flex-start;line-height:1.35}
.book-card .book-price{display:flex;align-items:center;padding:0}
.book-card .btn{height:44px;display:flex;align-items:center;justify-content:center;padding:9px 12px}

.tile:hover,.tile:focus-visible,.tile:active{border-color:#1769e0;box-shadow:0 12px 32px rgba(23,105,224,.17)}
.unit:hover,.unit:focus-visible,.unit:active{background:#edf4ff;border-color:#1769e0;color:#075dcc;box-shadow:0 6px 20px rgba(23,105,224,.12)}
.book-card:hover,.book-card:focus-within{border-color:#1769e0;box-shadow:0 12px 30px rgba(23,105,224,.13)}
button.btn:hover,button.btn:focus-visible,.btn.secondary:hover,.btn.secondary:focus-visible{background:#1769e0;color:#fff;border-color:#1769e0;box-shadow:0 7px 20px rgba(23,105,224,.2)}
button.btn:active,.btn.secondary:active{background:#0754bd;color:#fff;transform:scale(.98)}
.ghost:active{background:#1769e0;color:#fff}

/* Refinamiento solicitado: nombres de materias azules, precio independiente y cuenta alineada */
.tile h3{color:#1769e0;font-weight:750;letter-spacing:-.025em}
.subject-price{color:var(--blue);display:inline-flex;align-items:center;gap:6px;width:max-content;max-width:100%;padding:8px 13px;border-radius:999px;background:linear-gradient(135deg,#fff2d8,#ffe5b0);border:1px solid #f0d49b;color:#80510b;font-size:1rem;font-weight:800;box-shadow:0 3px 10px rgba(161,111,25,.09)}

/* Asistente de voz accesible */
.instagram-link{color:var(--blue);font-weight:800;text-decoration:none}.instagram-link:hover{transform:scale(.96);display:inline-block}
/* Ajuste final: precio azul, sin pastilla dorada */
.tile .subject-price,.banner .subject-price{display:inline-flex;align-items:baseline;gap:6px;width:auto;max-width:100%;padding:0;background:transparent;border:0;border-radius:0;box-shadow:none;color:#1264d8;font-size:1.15rem;font-weight:800;margin:12px 0}
.tile .subject-price span,.banner .subject-price span{color:#1264d8;font-size:.86rem;font-weight:600}
.tile-cover,.hero-slideshow{background:linear-gradient(135deg,#dceaff,#eef6ff 55%,#c5ddff)}
.tile-cover img{background:linear-gradient(135deg,#dceaff,#c5ddff)}
.hero-slide-image{background:linear-gradient(135deg,#dceaff,#c5ddff)}

/* Ajuste solicitado: azul Apple en materias, círculos y resultados */
:root{
  --blue:#0866e8;
  --cyan:#0866e8;
  --line:#dfe5ee;
  --good:#0866e8;
}
.hero-slide-caption strong,
.showcase-title,
.tile h3,
.banner h1{
  color:#0866e8;
}

  display:inline-block;

  text-shadow:none;
}

}

form .btn[type="submit"]{

/* Biblioteca: portadas editoriales y vista previa con transición tipo iOS */
.books-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;align-items:stretch}
.book-card{min-height:0;padding:16px;align-items:center;text-align:center;gap:10px}
.book-cover-trigger{display:block;width:100%;max-width:220px;margin:0 auto 5px;padding:0;border:0;background:transparent;cursor:pointer;perspective:900px}
.book-cover{position:relative;width:100%;aspect-ratio: .74;display:block;filter:drop-shadow(0 12px 16px rgba(8,18,35,.25));transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s;transform-style:preserve-3d}
.book-cover-trigger:hover .book-cover{transform:translateY(-5px) rotateY(-4deg);filter:drop-shadow(0 18px 20px rgba(8,18,35,.3))}
.book-cover-face{position:absolute;inset:0 0 0 7%;overflow:hidden;border-radius:3px 12px 12px 3px;background:#071321;box-shadow:inset 5px 0 8px #ffffff12,inset -1px 0 0 #ffffff22;display:flex;flex-direction:column;padding:8% 8% 7%;color:#fff;text-align:left}
.book-cover-spine{position:absolute;z-index:2;left:0;top:0;bottom:0;width:9%;border-radius:3px 0 0 3px;background:linear-gradient(90deg,#050912,#1b2c43 55%,#07101c);box-shadow:inset -1px 0 0 #ffffff28}
.book-cover-kicker,.book-cover-bottom{font-size:clamp(6px,.72vw,9px);letter-spacing:.16em;font-weight:800;opacity:.78;position:relative;z-index:1}
.book-cover-art{position:absolute;inset:12% 0 20%;opacity:.95}.book-cover-art svg{width:100%;height:100%;display:block}
.book-cover-title{position:relative;z-index:1;margin-top:auto;font-size:clamp(16px,2vw,24px);line-height:1.04;font-weight:800;letter-spacing:-.04em;text-shadow:0 2px 12px #0009}
.book-cover-sub{position:relative;z-index:1;margin-top:7px;font-size:clamp(7px,.8vw,10px);letter-spacing:.12em;font-weight:700;color:#a9c9ff}
.book-cover-bottom{margin-top:14px;font-size:7px}
.book-bio .book-cover-face{background:linear-gradient(145deg,#092a2b,#06111c 72%)}.book-chem .book-cover-face{background:linear-gradient(145deg,#082a45,#07111f 72%)}.book-math .book-cover-face{background:linear-gradient(145deg,#0a1c43,#050a17 72%)}.book-phys .book-cover-face{background:linear-gradient(145deg,#0b2844,#060d19 72%)}
.book-card h3{min-height:2.4em;margin:2px 0 0;align-items:center;justify-content:center;font-size:1.08rem;line-height:1.25}.book-card .book-price{margin:0;padding:0;color:#1769e0;font-size:1.1rem;font-weight:850}.book-card .btn{margin-top:2px}
.book-preview-backdrop{position:fixed;inset:0;z-index:9999;background:rgba(3,8,18,.64);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:grid;place-items:center;padding:22px;animation:bookFadeIn .22s ease both}
.book-preview-panel{position:relative;width:min(920px,100%);max-height:min(88vh,820px);overflow:auto;background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.7);border-radius:28px;box-shadow:0 35px 100px rgba(0,0,0,.35);padding:clamp(22px,4vw,42px);animation:bookZoomIn .48s cubic-bezier(.16,1,.3,1) both;transform-origin:center}
.book-preview-close{position:absolute;right:16px;top:14px;width:38px;height:38px;border:0;border-radius:50%;background:#edf2f8;color:#20334c;font-size:27px;line-height:1;cursor:pointer;z-index:3}
.book-preview-layout{display:grid;grid-template-columns:minmax(190px,.75fr) minmax(0,1.4fr);gap:clamp(24px,5vw,54px);align-items:center}
.book-preview-visual{display:flex;flex-direction:column;align-items:center;gap:17px}.book-cover-large{width:min(100%,270px);filter:drop-shadow(0 20px 22px rgba(9,24,48,.3))}.book-cover-large .book-cover-kicker{font-size:8px}.book-cover-large .book-cover-title{font-size:clamp(22px,3vw,30px)}.book-preview-price{font-size:1.25rem;color:#1769e0;font-weight:850}
.book-preview-content h2{margin:7px 0 8px;font-size:clamp(1.6rem,3vw,2.25rem);letter-spacing:-.04em}.book-toc{list-style:none;padding:0;margin:20px 0;display:grid;gap:0}.book-toc li{display:flex;flex-direction:column;gap:3px;padding:11px 0;border-bottom:1px solid #e6ebf2}.book-toc li span{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#1769e0;font-weight:800}.book-toc li strong{font-size:.95rem;color:#1b293b;font-weight:650}.book-preview-note{font-size:.82rem;color:#69788b;margin:16px 0}.book-preview-content .btn{background:#1769e0;color:white;border-radius:13px;padding:12px 20px}
body.book-preview-open{overflow:hidden}

let activeNav='Materias';function setNav(name){activeNav=name;document.querySelectorAll('nav [data-nav]').forEach(b=>{const on=b.dataset.nav===name;b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}setNav(activeNav);
let subject=null,unit=0,chosen={};const app=document.getElementById('app');function render(s){app.classList.remove('page');void app.offsetWidth;app.innerHTML=s;app.classList.add('page');window.scrollTo({top:0,behavior:'smooth'})}function done(){return JSON.parse(localStorage.getItem('fm_done')||'{}')}function save(d){localStorage.setItem('fm_done',JSON.stringify(d))}
let showcaseIndex=0,showcaseTimer=null;
function home(){setNav('Materias');subject=null;if(showcaseTimer)clearInterval(showcaseTimer);render(`<section class="hero"><div class="eyebrow">Plataforma educativa</div><h1>El conocimiento<br><span style="color:var(--cyan)">abre caminos.</span></h1><p>Una experiencia de aprendizaje clara y accesible para estudiar ciencias y prepararte para el nivel universitario.</p><button class="btn" onclick="document.getElementById('subjects').scrollIntoView({behavior:'smooth'})">Explorar materias</button><div class="hero-slideshow"><img id="heroSlideImage" class="hero-slide-image" src="${S.biologia.img}" alt="Imagen de Biología"><div class="hero-slide-shade"></div><div class="hero-slide-caption"><strong id="heroSlideTitle">Biología</strong><span id="heroSlideDesc">La ciencia de la vida</span></div><div class="hero-dots" id="heroSlideDots">${Object.entries(S).map(([k,v],i)=>`<button aria-label="Mostrar ${v.n}" class="${i===0?'active':''}" onclick="showcaseGo(${i})"></button>`).join('')}</div></div></section><div class="head" id="subjects"><h2>Elegí tu materia</h2></div><div class="grid">${Object.entries(S).map(([k,v])=>{let n=v.u.filter((x,i)=>done()[k+'-'+i]).length;return `<article class="tile" onclick="openSubject('${k}')"><div><div class="tile-cover"><img src="${v.img}" alt="${v.n}"></div><h3>${v.n}</h3><p class="muted">${v.desc}</p><p class="subject-price">G. 50.000 <span>/ mes</span></p><div class="progress-wrap"><div class="progress" style="width:${n/v.u.length*100}%"></div></div><small class="muted">Progreso: ${n}/${v.u.length} unidades</small></div><b style="color:var(--cyan)">Entrar al aula →</b></article>`}).join('')}</div>`);showcaseGo(0);showcaseTimer=setInterval(()=>showcaseGo((showcaseIndex+1)%4),5000)}
function showcaseGo(i){showcaseIndex=i;let item=Object.entries(S)[i];if(!item)return;let image=document.getElementById('heroSlideImage');if(!image)return;image.classList.add('fade');setTimeout(()=>{if(!document.getElementById('heroSlideImage'))return;image.src=item[1].img;image.alt='Imagen de '+item[1].n;document.getElementById('heroSlideTitle').textContent=item[1].n;document.getElementById('heroSlideDesc').textContent=item[1].desc;image.classList.remove('fade');document.querySelectorAll('#heroSlideDots button').forEach((b,j)=>b.classList.toggle('active',j===i));},250)}
function isFree(k,i){return i<2||(k==='biologia'&&i===2)||(k==='quimica'&&i===2)||(k==='fisica'&&i===2)}
function accessNote(k,i){if(i<2)return 'Video gratuito';if(k==='biologia'&&i===2)return 'Gratis: un solo acceso de visualización';if((k==='quimica'||k==='fisica')&&i===2)return 'Gratis: primeros 20 segundos';return 'Acceso con suscripción'}
function openSubject(k){setNav('Materias');subject=k;let v=S[k],n=v.u.filter((x,i)=>done()[k+'-'+i]).length;render(`<div class="banner"><div class="eyebrow">Aula virtual</div><h1>${v.n}</h1><p class="muted">${v.desc}</p><p class="subject-price">G. 50.000 <span>/ mes</span></p><div class="progress-wrap"><div class="progress" style="width:${n/v.u.length*100}%"></div></div><small>${n} de ${v.u.length} unidades completadas</small></div><div class="head"><h2>Unidades y videos</h2><p class="muted">Entrá a cada video para estudiar. Los videos de presentación no tienen examen.</p></div>${v.u.map((u,i)=>`<button class="unit" onclick="openUnit('${k}',${i})"><span><b>${i+1}. ${u[0]}</b><small>${i<2?'Video de presentación':u[1].length?'Video y evaluación':'Video del curso'}</small></span><span class="unit-progress"><b>${accessNote(k,i)}</b><small>${done()[k+'-'+i]?'✓ Completado':''}</small></span></button>`).join('')}<button class="ghost" onclick="home()">← Volver a materias</button>`)}
function openUnit(k,i){subject=k;unit=i;chosen={};let v=S[k],u=v.u[i],free=isFree(k,i),intro=i<2,limited=(k==='biologia'&&i===2),timed=((k==='quimica'||k==='fisica')&&i===2),key='fm_seen_'+k+'_'+i;let already=limited&&localStorage.getItem(key)==='1';let blocked=!free;let idx=i+1;let src='https://www.youtube-nocookie.com/embed/videoseries?list='+v.playlist+'&index='+idx+'&rel=0';render(`<div class="banner"><div class="eyebrow">${v.n} · Video ${i+1}</div><h1>${u[0]}</h1><p class="muted">${accessNote(k,i)}</p></div><div class="video-grid"><div><iframe id="courseVideo" class="video" src="${blocked||already?'about:blank':src}" title="${u[0]}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>${blocked?`<div class="card"><h3>Contenido con acceso pago</h3><p>Este video forma parte del curso completo. Para acceder necesitás una suscripción activa.</p></div>`:''}${already?`<div class="card"><h3>Acceso gratuito utilizado</h3><p>El video gratuito de Biología general ya fue reproducido en este navegador.</p></div>`:''}${timed?'<p class="muted" id="timerNotice">Los primeros 20 segundos son gratuitos.</p>':''}</div></div>${intro?`<p class="muted">Video de presentación · No incluye preguntas ni examen.</p>`:u[1].length?`<div class="head"><h2>Evaluación: ${u[0]}</h2><p class="muted">10 preguntas · Elegí una respuesta por pregunta.</p></div><div class="card"><div class="progress-wrap"><div id="prog" class="progress"></div></div><small id="proglabel" class="muted">0 de 10 respondidas</small></div><form onsubmit="grade(event)">${u[1].map((q,j)=>`<div class="qbox"><b>${j+1}. ${q[0]}</b>${q[1].map((o,z)=>`<button type="button" class="opt" id="o${j}-${z}" onclick="pick(${j},${z})">${'ABCD'[z]}. ${o}</button>`).join('')}</div>`).join('')}<button class="btn" type="submit">Corregir examen</button></form><div id="result"></div>`:`<p class="muted">Este video no tiene evaluación.</p>`}<button class="ghost" onclick="openSubject('${k}')">← Volver a unidades</button>`);if(limited&&!already&&!blocked){localStorage.setItem(key,'1')}if(timed&&!blocked){let seconds=20;let timer=setInterval(()=>{let frame=document.getElementById('courseVideo'),note=document.getElementById('timerNotice');if(!frame||!note){clearInterval(timer);return}seconds--;note.textContent=seconds>0?'Acceso gratuito: '+seconds+' segundos restantes':'El período gratuito terminó. Suscribite para continuar.';if(seconds<=0){frame.src='about:blank';clearInterval(timer)}},1000)}}
function pick(q,a){chosen[q]=a;for(let z=0;z<4;z++)document.getElementById(`o${q}-${z}`).classList.toggle('selected',z===a);let n=Object.keys(chosen).length;document.getElementById('prog').style.width=n*10+'%';document.getElementById('proglabel').textContent=n+' de 10 respondidas'}
function grade(e){e.preventDefault();let qs=S[subject].u[unit][1];if(unit<2||!qs.length)return;if(Object.keys(chosen).length!==10){alert('Respondé las diez preguntas antes de corregir.');return}let score=0;qs.forEach((q,j)=>{if(chosen[j]===q[2])score++;q[1].forEach((_,z)=>{let el=document.getElementById(`o${j}-${z}`);el.disabled=true;if(z===q[2])el.classList.add('correct');else if(z===chosen[j])el.classList.add('wrong')})});let pct=score*10,pass=pct>=70,d=done();if(pass)d[subject+'-'+unit]=true;save(d);document.getElementById('result').innerHTML=`<div class="result"><h3>${pass?'¡Unidad aprobada!':'Todavía no alcanzaste el mínimo'}</h3><b>Resultado: ${score}/10 · ${pct}%</b><p>${pass?'La unidad quedó registrada como aprobada.':'Necesitás al menos 7 respuestas correctas. Podés volver a intentarlo.'}</p><button class="btn" onclick="openSubject('${subject}')">Volver a las unidades</button></div>`}
function certificate(k){let v=S[k];if(v.u.some((x,i)=>x[1].length&&!done()[k+'-'+i]))return;render(`<div class="cert"><div style="letter-spacing:.2em">FACUNDO MARENGO · EDUCACIÓN</div><h2>Certificado de aprobación</h2><p>Se certifica que</p><input id="student" placeholder="Nombre y apellido del estudiante"><p>ha completado satisfactoriamente el curso de</p><h2>${v.n}</h2><p>y ha aprobado las evaluaciones de todas sus unidades.</p><p style="margin-top:35px">____________________________<br>Facundo Marengo</p><small>Certificado educativo emitido por esta plataforma.</small></div><p style="text-align:center"><button class="btn" onclick="window.print()">Imprimir / Guardar como PDF</button> <button class="ghost" onclick="openSubject('${k}')">Volver</button></p>`)}

function bookCover(b,i,large=false){return `<div class="book-cover ${large?'book-cover-large':''} book-${b.kind}" role="img" aria-label="Portada de ${b.title}"><div class="book-cover-spine"></div><div class="book-cover-face"><div class="book-cover-kicker">TEMBIKUUAA · BIBLIOTECA</div><div class="book-cover-art">${bookArt(b.kind)}</div><div class="book-cover-title">${b.title}</div><div class="book-cover-sub">${b.tag}</div><div class="book-cover-bottom">EDICIÓN ACADÉMICA</div></div></div>`}
function openBookPreview(i){const b=BOOKS[i];const card=document.querySelectorAll('.book-entry')[i];const r=card?card.getBoundingClientRect():{left:0,top:0,width:innerWidth,height:innerHeight};const modal=document.createElement('div');modal.className='book-preview-backdrop';modal.id='bookPreview';modal.innerHTML=`<section class="book-preview-panel" role="dialog" aria-modal="true" aria-label="Biblioteca de ${b.title}"><button class="book-preview-close" aria-label="Cerrar" onclick="closeBookPreview()">×</button><div class="book-preview-layout"><div class="book-preview-visual">${bookCover(b,i,true)}<div class="book-preview-price">G. 25.000</div></div><div class="book-preview-content"><div class="eyebrow">BIBLIOTECA · ${b.tag}</div><h2>${b.title}</h2><p class="muted">Libro de estudio · contenido e índice</p><ol class="book-toc">${b.chapters.map((c,n)=>`<li><span>Capítulo ${String(n+1).padStart(2,'0')}</span><strong>${c}</strong></li>`).join('')}</ol><p class="book-preview-note">Esta vista presenta la estructura temática del libro y permite consultar los contenidos incluidos.</p><button class="btn" onclick="alert('Agregá aquí tu enlace o datos de compra.')">Consultar compra</button></div></div></section>`;modal.style.setProperty('--from-x',r.left+'px');modal.style.setProperty('--from-y',r.top+'px');modal.style.setProperty('--from-sx',Math.max(.01,r.width/innerWidth));modal.style.setProperty('--from-sy',Math.max(.01,r.height/innerHeight));modal.addEventListener('click',e=>{if(e.target===modal)closeBookPreview()});document.body.appendChild(modal);document.body.classList.add('book-preview-open');document.addEventListener('keydown',bookEscClose)}
function bookEscClose(e){if(e.key==='Escape')closeBookPreview()}
function closeBookPreview(){const m=document.getElementById('bookPreview');if(m)m.remove();document.body.classList.remove('book-preview-open');document.removeEventListener('keydown',bookEscClose)}

 Biología, Química, Matemática y Física organizados por unidades, explicaciones claras y recursos que permitan estudiar de manera autónoma. La intención es ofrecer un espacio ordenado, accesible y útil para quienes desean reforzar lo aprendido, descubrir nuevos temas o prepararse mejor para sus estudios.</p><p>Este proyecto no pretende reemplazar a la universidad, ni competir con las instituciones educativas o con la formación académica que ellas ofrecen. Busca ser un recurso complementario de apoyo: una herramienta para repasar conceptos, ampliar conocimientos y acompañar el proceso de aprendizaje de cada estudiante. La formación universitaria, sus docentes, sus prácticas y sus evaluaciones siguen teniendo un papel fundamental.</p><p>Creo que aprender no debería ser un privilegio. Mi propósito es contribuir, desde este espacio, a que la ciencia esté cada vez más al alcance de todos.</p></div></div><button class="ghost" onclick="home()">← Volver</button>`)}

.book-preview-panel{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;overflow:auto!important;border:0!important;border-radius:0!important;padding:clamp(24px,5vw,64px)!important;display:flex!important;align-items:center!important;justify-content:center!important;animation:bookEnterFromCard .58s cubic-bezier(.2,.85,.2,1) both!important;transform-origin:var(--zoom-origin-x,50vw) var(--zoom-origin-y,50vh)!important;background:linear-gradient(145deg,#fff 0%,#f5f8fc 100%)!important}
.book-preview-layout{width:min(1120px,100%)!important;grid-template-columns:minmax(220px,.72fr) minmax(0,1.35fr)!important;gap:clamp(28px,6vw,76px)!important;align-items:start!important;margin:auto!important}
.book-preview-visual{position:sticky;top:24px!important;align-self:start!important;padding-top:14px}
.book-preview-visual .book-cover-large{width:min(100%,330px)!important}
.book-preview-content{max-width:700px!important}
.book-preview-content h2{font-size:clamp(1.8rem,4vw,2.8rem)!important}
.book-toc{max-height:48vh;overflow:auto;padding-right:8px}
.book-preview-close{position:fixed!important;right:24px!important;top:22px!important;width:44px!important;height:44px!important;background:#eaf1fb!important;color:#1769e0!important;font-size:30px!important;box-shadow:0 5px 18px rgba(20,50,90,.12)}
@keyframes bookBackdropIn{from{opacity:0}to{opacity:1}}
@keyframes bookEnterFromCard{0%{opacity:.7;transform:scale(.12);border-radius:24px;filter:blur(3px)}65%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1);border-radius:0;filter:blur(0)}}
@media(max-width:760px){.book-preview-panel{padding:76px 20px 28px!important;align-items:flex-start!important}.book-preview-layout{grid-template-columns:minmax(0,1fr)!important;gap:22px!important}.book-preview-visual{position:relative;top:auto!important;display:flex;flex-direction:row!important;justify-content:flex-start!important;align-items:center!important;padding:0!important}.book-preview-visual .book-cover-large{width:min(38vw,170px)!important}.book-preview-content{width:100%!important}.book-toc{max-height:none!important;overflow:visible!important}.book-preview-close{right:16px!important;top:14px!important}}
@media(prefers-reduced-motion:reduce){.book-preview-backdrop,.book-preview-panel{animation:none!important}}
</style>

<script id="automatic-day-night-switch">
(()=>{
  const updateAutomaticTheme=()=>{
    const hour=new Date().getHours();
    const isNight=hour>=19||hour<7;
    const theme=isNight?'dark':'light';
    document.documentElement.dataset.theme=theme;
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content',isNight?'#0b1220':'#f5f7fb');
  };
  updateAutomaticTheme();
  // Revisa periódicamente la hora local para cambiar el tema sin recargar la página.
  setInterval(updateAutomaticTheme,60*1000);
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden) updateAutomaticTheme();
  });
})();
</script>
</body>
