let activeNav='Materias';function setNav(name){activeNav=name;document.querySelectorAll('nav [data-nav]').forEach(b=>{const on=b.dataset.nav===name;b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}setNav(activeNav);
let subject=null,unit=0,chosen={};const app=document.getElementById('app');function render(s){app.classList.remove('page');void app.offsetWidth;app.innerHTML=s;app.classList.add('page');window.scrollTo({top:0,behavior:'smooth'})}function done(){return JSON.parse(localStorage.getItem('fm_done')||'{}')}function save(d){localStorage.setItem('fm_done',JSON.stringify(d))}
let showcaseIndex=0,showcaseTimer=null;
function home(){setNav('Materias');subject=null;if(showcaseTimer)clearInterval(showcaseTimer);render(`<section class="hero"><div class="eyebrow">Plataforma educativa</div><h1>El conocimiento<br><span style="color:var(--cyan)">abre caminos.</span></h1><p>Una experiencia de aprendizaje clara y accesible para estudiar ciencias y prepararte para el nivel universitario.</p><button class="btn" onclick="document.getElementById('subjects').scrollIntoView({behavior:'smooth'})">Explorar materias</button><div class="hero-slideshow"><img id="heroSlideImage" class="hero-slide-image" src="${S.biologia.img}" alt="Imagen de Biología"><div class="hero-slide-shade"></div><div class="hero-slide-caption"><strong id="heroSlideTitle">Biología</strong><span id="heroSlideDesc">La ciencia de la vida</span></div><div class="hero-dots" id="heroSlideDots">${Object.entries(S).map(([k,v],i)=>`<button aria-label="Mostrar ${v.n}" class="${i===0?'active':''}" onclick="showcaseGo(${i})"></button>`).join('')}</div></div></section><div class="head" id="subjects"><h2>Elegí tu materia</h2><p class="muted">Se mantienen las imágenes originales de las cuatro materias. Cada aula contiene unidades, videos, exámenes y seguimiento del progreso.</p></div><div class="grid">${Object.entries(S).map(([k,v])=>{let n=v.u.filter((x,i)=>done()[k+'-'+i]).length;return `<article class="tile" onclick="openSubject('${k}')"><div><div class="tile-cover"><img src="${v.img}" alt="${v.n}"></div><h3>${v.n}</h3><p class="muted">${v.desc}</p><p class="subject-price">G. 50.000 <span>/ mes</span></p><div class="progress-wrap"><div class="progress" style="width:${n/v.u.length*100}%"></div></div><small class="muted">Progreso: ${n}/${v.u.length} unidades</small></div><b style="color:var(--cyan)">Entrar al aula →</b></article>`}).join('')}</div>`);showcaseGo(0);showcaseTimer=setInterval(()=>showcaseGo((showcaseIndex+1)%4),5000)}
function showcaseGo(i){showcaseIndex=i;let item=Object.entries(S)[i];if(!item)return;let image=document.getElementById('heroSlideImage');if(!image)return;image.classList.add('fade');setTimeout(()=>{if(!document.getElementById('heroSlideImage'))return;image.src=item[1].img;image.alt='Imagen de '+item[1].n;document.getElementById('heroSlideTitle').textContent=item[1].n;document.getElementById('heroSlideDesc').textContent=item[1].desc;image.classList.remove('fade');document.querySelectorAll('#heroSlideDots button').forEach((b,j)=>b.classList.toggle('active',j===i));},250)}
function openSubject(k){setNav('Materias');subject=k;let v=S[k],n=v.u.filter((x,i)=>done()[k+'-'+i]).length;render(`<div class="banner"><div class="eyebrow">Aula virtual</div><h1>${v.n}</h1><p class="muted">${v.desc}</p><p class="subject-price">G. 50.000 <span>/ mes</span></p><div class="progress-wrap"><div class="progress" style="width:${n/v.u.length*100}%"></div></div><small>${n} de ${v.u.length} unidades aprobadas</small></div><div class="head"><h2>Unidades y exámenes</h2><p class="muted">Cada sección tiene diez preguntas independientes de nivel introductorio-universitario.</p></div>${v.u.map((u,i)=>`<button class="unit" onclick="openUnit('${k}',${i})"><span><b>${i+1}. ${u[0]}</b><small>Videos y examen · 10 preguntas</small></span><span class="unit-progress"><b>${done()[k+'-'+i]?'✓ Aprobado':'Pendiente'}</b><div class="progress-wrap"><div class="progress" style="width:${done()[k+'-'+i]?100:0}%"></div></div><small>${done()[k+'-'+i]?'100% completado':'0% completado'}</small></span></button>`).join('')}<div class="card" style="margin-top:20px"><h3>Certificado de ${v.n}</h3><p class="muted">Se habilita al aprobar las cuatro unidades con un mínimo del 70%.</p><button class="btn ${n===v.u.length?'':'secondary'}" ${n===v.u.length?'':'disabled'} onclick="certificate('${k}')">Ver certificado</button></div><button class="ghost" onclick="home()">← Volver a materias</button>`)}
function openUnit(k,i){subject=k;unit=i;chosen={};let v=S[k],u=v.u[i];render(`<div class="banner"><div class="eyebrow">${v.n} · Unidad ${i+1}</div><h1>${u[0]}</h1><p class="muted">Revisá el material audiovisual y luego completá el examen de diez preguntas.</p></div><div class="head"><h2>Videos: ${u[0]}</h2><p class="muted">El espacio está preparado para insertar el enlace de la playlist o del video de cada unidad.</p></div><div class="video-grid"><div><iframe class="video" src="https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent(v.n+' '+u[0]+' clase') }" title="Buscar videos educativos" allowfullscreen></iframe><small class="muted">Búsqueda de clases relacionadas. Podés sustituir el enlace por tu video o playlist exactos.</small></div></div><div class="card" style="margin-top:18px"><h3>Barra de progreso del examen</h3><div class="progress-wrap"><div id="prog" class="progress"></div></div><small id="proglabel" class="muted">0 de 10 respondidas</small></div><div class="head"><h2>Examen: ${u[0]}</h2><p class="muted">10 preguntas · Elegí una respuesta por pregunta.</p></div><form onsubmit="grade(event)">${u[1].map((q,j)=>`<div class="qbox"><b>${j+1}. ${q[0]}</b>${q[1].map((o,z)=>`<button type="button" class="opt" id="o${j}-${z}" onclick="pick(${j},${z})">${'ABCD'[z]}. ${o}</button>`).join('')}</div>`).join('')}<button class="btn" type="submit">Corregir examen</button></form><div id="result"></div><button class="ghost" onclick="openSubject('${k}')">← Volver a unidades</button>`)}
function pick(q,a){chosen[q]=a;for(let z=0;z<4;z++)document.getElementById(`o${q}-${z}`).classList.toggle('selected',z===a);let n=Object.keys(chosen).length;document.getElementById('prog').style.width=n*10+'%';document.getElementById('proglabel').textContent=n+' de 10 respondidas'}
function grade(e){e.preventDefault();let qs=S[subject].u[unit][1];if(Object.keys(chosen).length!==10){alert('Respondé las diez preguntas antes de corregir.');return}let score=0;qs.forEach((q,j)=>{if(chosen[j]===q[2])score++;q[1].forEach((_,z)=>{let el=document.getElementById(`o${j}-${z}`);el.disabled=true;if(z===q[2])el.classList.add('correct');else if(z===chosen[j])el.classList.add('wrong')})});let pct=score*10,pass=pct>=70,d=done();if(pass)d[subject+'-'+unit]=true;save(d);document.getElementById('result').innerHTML=`<div class="result"><h3>${pass?'¡Unidad aprobada!':'Todavía no alcanzaste el mínimo'}</h3><b>Resultado: ${score}/10 · ${pct}%</b><p>${pass?'La unidad quedó registrada como aprobada.':'Necesitás al menos 7 respuestas correctas. Podés volver a intentarlo.'}</p><button class="btn" onclick="openSubject('${subject}')">Volver a las unidades</button></div>`}
function certificate(k){let v=S[k];if(v.u.some((x,i)=>!done()[k+'-'+i]))return;render(`<div class="cert"><div style="letter-spacing:.2em">FACUNDO MARENGO · EDUCACIÓN</div><h2>Certificado de aprobación</h2><p>Se certifica que</p><input id="student" placeholder="Nombre y apellido del estudiante"><p>ha completado satisfactoriamente el curso de</p><h2>${v.n}</h2><p>y ha aprobado las evaluaciones de todas sus unidades.</p><p style="margin-top:35px">____________________________<br>Facundo Marengo</p><small>Certificado educativo emitido por esta plataforma.</small></div><p style="text-align:center"><button class="btn" onclick="window.print()">Imprimir / Guardar como PDF</button> <button class="ghost" onclick="openSubject('${k}')">Volver</button></p>`)}
function books(){setNav('Libros');render(`<section class="hero"><div class="eyebrow">Biblioteca</div><h1>Libros para aprender</h1><p>Material de apoyo para acompañar tu formación.</p></section><div class="books-grid">${['Biología general','Química general','Matemática universitaria','Física general'].map((x,i)=>`<article class="card book-card"><div class="book-mark">Bibliografía</div><h3>${x}</h3><p class="muted book-description">Material de estudio</p><p class="book-price">G. 25.000</p><button class="btn secondary" onclick="alert('Agregá aquí tu enlace o datos de compra.')">Consultar compra</button></article>`).join('')}</div><button class="ghost" onclick="home()">← Volver</button>`)}
